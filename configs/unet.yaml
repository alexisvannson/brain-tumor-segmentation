model:
  down_layers:
    - [4, 64]
    - [64, 128]
    - [128, 256]
    - [256, 512]
    - [512, 1024]
  up_layers:
    - [1024, 512]
    - [512, 256]
    - [256, 128]
    - [128, 64]
  final_block: [64, 3]

training:
  data_dir: brats2020/BraTS2020_training_data/content/data
  checkpoint_dir: checkpoints
  epochs: 50
  batch_size: 8
  lr: 1.0e-4
  val_split: 0.2
  num_workers: 4
